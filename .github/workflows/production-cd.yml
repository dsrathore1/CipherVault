name: "CipherVault | Production CD"

on:
    workflow_run:
        workflows:
            - "CipherVault | Backend CI"
            - "CipherVault | Frontend CI"
        types:
            - completed
        branches:
            - main

permissions:
    contents: read

concurrency:
    group: production-cd
    cancel-in-progress: false

jobs:
    publish-images:
        name: "Build and Publish Docker Images"
        if: >-
            github.event.workflow_run.conclusion == 'success'
            && github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout Release Commit"
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}

            - name: "Verify Both CI Workflows Passed"
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                  for workflow in backend-ci.yml frontend-ci.yml; do
                    conclusion=$(gh run list \
                      --repo "$REPOSITORY" \
                      --workflow "$workflow" \
                      --commit "$RELEASE_SHA" \
                      --branch main \
                      --status completed \
                      --json conclusion \
                      --jq '[.[] | select(.conclusion == "success")] | length')

                    if [ "$conclusion" -lt 1 ]; then
                      echo "No successful $workflow run found for $RELEASE_SHA"
                      exit 1
                    fi
                  done

            - name: "Set Up Docker Buildx"
              uses: docker/setup-buildx-action@v3

            - name: "Log In to Docker Hub"
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: "Build and Push Backend Image"
              uses: docker/build-push-action@v6
              with:
                  context: ./backend
                  file: ./backend/Dockerfile
                  push: true
                  tags: |
                      prayagraj55/ciphervault-backend:latest
                      prayagraj55/ciphervault-backend:${{ github.event.workflow_run.head_sha }}

            - name: "Build and Push Frontend Image"
              uses: docker/build-push-action@v6
              with:
                  context: ./frontend
                  file: ./frontend/Dockerfile
                  push: true
                  tags: |
                      prayagraj55/ciphervault-frontend:latest
                      prayagraj55/ciphervault-frontend:${{ github.event.workflow_run.head_sha }}
