services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ciphervault-frontend:latest
    container_name: ciphervault-frontend
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: "https://ciphervault-backend.fastapicloud.dev"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
